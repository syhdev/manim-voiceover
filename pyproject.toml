[project]
name = "manim-voiceover"
version = "0.3.7"
description = "Manim plugin for all things voiceover"
authors = [
    { name = "The Manim Community Developers", email = "contact@manim.community" },
]
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
keywords = [
    "text-to-speech",
    "tts",
    "voiceover",
    "manim",
    "recording",
    "speech synthesis",
    "math animations",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Sound/Audio :: Capture/Recording",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Visualization",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "manim",
    "sox>=1.5.0",
    "python-dotenv>=1.2.2",
    "mutagen>=1.47.0",
    "pydub>=0.25.1",
    "pip>=26.1.1",
    "python-slugify>=8.0.4",
]

[project.optional-dependencies]
azure = ["azure-cognitiveservices-speech>=1.50.0"]
gtts = ["gTTS>=2.5.4"]
openai = ["openai>=2.38.0"]
pyttsx3 = ["pyttsx3>=2.99"]
coqui = []
recorder = ["PyAudio>=0.2.14", "pynput>=1.8.2"]
translate = ["deepl>=1.30.0"]
elevenlabs = ["elevenlabs>=2.50.0"]
mistralai = ["mistralai>=2.4.7"]
transcribe = ["openai-whisper>=20250625", "stable-ts>=2.19.1"]
all = [
    "azure-cognitiveservices-speech>=1.50.0",
    "gTTS>=2.5.4",
    "pyttsx3>=2.99",
    "PyAudio>=0.2.14",
    "pynput>=1.8.2",
    "openai>=2.38.0",
    "deepl>=1.30.0",
    "openai-whisper>=20250625",
    "stable-ts>=2.19.1",
    "elevenlabs>=2.50.0",
    "mistralai>=2.4.7",
]

[project.urls]
Homepage = "https://voiceover.manim.community"
Repository = "https://github.com/ManimCommunity/manim-voiceover"
Documentation = "https://voiceover.manim.community"

[project.scripts]
manim_translate = "manim_voiceover.translate.translate:main"
manim_render_translation = "manim_voiceover.translate.render:main"

[project.entry-points."manim.plugins"]
manim_voiceover = "manim_voiceover"

[dependency-groups]
dev = [
    "Pygments>=2.20.0",
    "pytest-cov>=7.1.0",
    "pytest>=9.0.3",
    "pylint>=4.0.5",
    "Sphinx>=9.1.0",
    "sphinx-copybutton>=0.5.2",
    "sphinxext-opengraph>=0.13.0",
    "furo>=2025.12.19",
    "recommonmark>=0.7.1",
    "matplotlib>=3.10.9",
    "pre-commit>=4.6.0",
    "gitpython>=3.1.50",
    "pygithub>=2.9.1",
    "isort>=8.0.1",
    "pytest-xdist>=3.8.0",
    "mypy>=2.1.0",
    "types-requests>=2.33.0.20260518",
    "sphinxcontrib-programoutput>=0.19",
    "psutil-wheels==5.8.0 ; python_full_version >= '3.10'",
    "psutil>=7.2.2 ; python_full_version < '3.10'",
    "sphinxcontrib-video>=0.4.2",
    "sphinx-sitemap>=2.9.0",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-name = ["manim_voiceover"]
module-root = ""

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"


[tool.ruff]

# Version Python cible (pour les règles de modernisation)
target-version = "py312"

# Longueur de ligne (88 = défaut de Black)
line-length = 88

# Dossiers à ignorer
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "dist",
    "docs",
]

[tool.ruff.lint]
# Règles à activer
select = [
    "E",   # Erreurs de style pycodestyle
    "F",   # Erreurs Pyflakes (variables non utilisées, etc.)
    "I",   # Tri des imports (isort)
    "B",   # Bugs potentiels (flake8-bugbear)
    "UP",  # Modernisation syntaxe (pyupgrade)
    "SIM", # Simplifications possibles
]

# Règles à ignorer
ignore = [
    "E501", # Ligne trop longue (géré par le formatter)
]

# Règles que --fix peut corriger automatiquement
fixable = ["ALL"]

[tool.ruff.format]
# Style des guillemets (comme Black)
quote-style = "double"

# Indentation (comme Black)
indent-style = "space"


[tool.ruff.lint.isort]
# Compatibilité avec le profil "black"
combine-as-imports = true
force-single-line = false
